<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>考研专注养成</title>
    <link rel="stylesheet" href="pet.css" />
  </head>
  <body>
    <div id="stage">
      <div class="halo"></div>

      <!-- 拖拽把手：整块凤凰区域。这里不绑任何鼠标事件——
           因为 -webkit-app-region: drag 会吞掉事件，这是它和点击互斥的根源。 -->
      <div id="grip" class="grip">
        <div id="phoenix" class="phoenix" data-mood="dozing" data-paused="false">&#129370;</div>
      </div>

      <!-- 可点区域：和拖拽把手分开，事件才能正常到达 -->
      <div class="tools">
        <button id="collapse" class="tool" title="收起 / 展开信息">&#9662;</button>
        <button id="menu" class="tool" title="菜单">&#8943;</button>
      </div>

      <!-- 收起时的精简读数：一眼看清"在不在学"和"今天多久" -->
      <div id="mini" class="mini" hidden>
        <span id="miniDot" class="dot"></span>
        <span id="miniTime" class="mini-time">00:00:00</span>
        <span id="miniState" class="mini-state">未开始</span>
      </div>

      <div id="bubble" class="bubble">
        <div class="row">
          <span id="time" class="time">00:00:00</span>
          <span id="goal" class="dim">今日 0%</span>
        </div>
        <div class="bar"><i id="spirit"></i></div>
        <div class="row">
          <span id="stageName" class="dim"></span>
          <span id="streak" class="dim"></span>
        </div>
        <div id="state" class="state">未开始</div>
        <div class="mountain">
          <div class="rail"></div>
          <div class="time-mark" id="markTime"></div>
          <div class="you-mark" id="markYou"></div>
        </div>
        <div id="altitude" class="dim"></div>
      </div>
    </div>
    <script type="module" src="pet.js"></script>
  </body>
</html>
