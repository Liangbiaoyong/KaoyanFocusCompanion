<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>考研专注养成 · 统计</title>
    <link rel="stylesheet" href="stats.css" />
  </head>
  <body>
    <h1>统计</h1>

    <section class="card">
      <h2>最近 30 天</h2>
      <div id="bars" class="bars"></div>
      <p class="hint" id="barsHint"></p>
      <p class="legend">
        <span class="swatch ok"></span>达标
        <span class="swatch short"></span>未达标
        <span class="swatch none"></span>没有记录
      </p>
    </section>

    <section class="card">
      <h2>走神记录（按次数）</h2>
      <ul id="distractions" class="list"></ul>
    </section>

    <section class="card">
      <h2>总计</h2>
      <ul id="totals" class="list"></ul>
    </section>

    <div class="actions">
      <button id="close" class="ghost">关闭</button>
    </div>

    <script type="module" src="stats.js"></script>
  </body>
</html>
